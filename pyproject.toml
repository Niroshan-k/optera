[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optera"
version = "1.0.2"
description = "Quantitative Supply Chain Framework & Stochastic Portfolio Optimization Engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Optera Core Development Team" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "supply-chain",
    "inventory-optimization",
    "particle-swarm-optimization",
    "monte-carlo-simulation",
    "markowitz-portfolio",
    "herfindahl-index",
    "stochastic-simulation"
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "statsmodels>=0.12.0",
    "scikit-learn>=0.24.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "reportlab>=3.5.0"
]

[project.urls]
Homepage = "https://github.com/Niroshan-k/optera"
Repository = "https://github.com/Niroshan-k/optera"
"Bug Tracker" = "https://github.com/Niroshan-k/optera/issues"
"Development Workspace" = "https://github.com/Niroshan-k/Event-Driven-Simulation-Framework"